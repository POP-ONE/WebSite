<style>

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cairo',Tahoma,sans-serif;color:var(--ink);line-height:1.6;min-height:100vh;

button{font-family:inherit;cursor:pointer;border:0}

html[dir=ltr] .ln .t,html[dir=ltr] .card .bd{text-align:left}
